<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>404 Page Not Found | {{ .Site.Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    {{ $themeCSS := resources.Get "css/main.css" }}
    {{ $customCSS := resources.Get "css/custom.css" }}
    {{ $opts := dict "minify" true }}
    {{ $css := slice $themeCSS $customCSS | resources.Concat "css/bundle.css" | css.TailwindCSS $opts }}

    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
    <link rel="icon" type="image/png" href="https://www.stellarvector.be/assets/logo/favicon.ico">

    <script defer src="https://go.stellarvector.be/go.js" data-website-id="4ab8dbef-be4f-4037-9a60-5c8d7952861a" data-domains="find.stellarvector.be" data-tag="404"></script>
    <script>
        function toggleTheme() {
            let nextTheme = document.documentElement.classList.contains('light') ? 'dark' : 'light';
            localStorage.setItem('theme', nextTheme);
            document.documentElement.classList.toggle('light');
        }
        if(localStorage.getItem('theme') == 'light'){toggleTheme()}
    </script>
</head>
<body class="antialiased flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-6xl font-bold">404</h1>
        <p class="text-2xl mt-4">page not found</p>
        <a href="/" data-umami-event="click: 404-to-home" class="btn-base btn-sv mt-8 uppercase tracking-widest">Find Stellar Vector</a>
    </div>
</body>
</html>
